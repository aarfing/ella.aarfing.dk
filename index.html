<!doctype html>
<html>
<head>
  <meta charset="utf-8" />

  <title>Ella 12 år!</title>

    body{background:#ffb3a2;color:#690667;margin:0;padding:0;font-family:helvetica,arial,verdana;line-height:1.3;}

<body>
  <main>
    <h1>🇩🇰 Ella 12 år! 🇩🇰</h1>
